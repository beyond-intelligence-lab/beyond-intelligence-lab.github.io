<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Beyond Intelligence Lab" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Beyond Intelligence Lab</title>
    <script>
      // Applied before first paint so the theme never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('bil.theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the system preference */
        }
      })()
      // GitHub Pages serves 404.html for deep links. That page bounces back here
      // with the original path in ?p=, which we restore before the router boots.
      ;(function () {
        var params = new URLSearchParams(window.location.search)
        var path = params.get('p')
        if (path) {
          window.history.replaceState(null, '', decodeURIComponent(path))
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
