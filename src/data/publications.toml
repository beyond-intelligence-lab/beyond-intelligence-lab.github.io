# 论文数据 —— 改这个文件就够了，推送到 main 后由 GitHub Actions 自动发布。
#
# 1. 顶部用 [[topic]] 声明研究方向（中英双语，用来生成筛选按钮），论文的 topics 引用其 id
# 2. 用 [[publication]] 添加论文，字段：id / title / authors / venues / year / topics，
#    可选 image（图片放 public/publications/）、summary（一句话简介）、links
# 3. venues 是标签列表，按展示顺序写：同一工作的会议版 + 期刊扩展版放在一条里，
#    如 ["ICDM 2023", "IEEE TSC 2026"]；已正式发表的不再单列 arXiv 版本。
#    下方 [venue] 用不带年份的简写索引 full_name（悬停全称）、kind 和可选 ccf（A/B/C）。
#    颜色按 kind 分：conference=蓝、journal=紫红、preprint=灰；无索引时默认会议色。
#    年份可在标签中间："ICMR 2025 Workshop" 对应 "ICMR Workshop"，不继承主会等级。
#    无 CCF 等级时省略 ccf，页面不会显示等级标签。
# 4. topics 是标签不是分类，一篇可以挂多个；左侧筛选是单选，一次看一个方向
# 5. year 用会议版年份，用于排序和年份分组；代码按年份从新到旧，再按
#    CCF A → B → C → Non（无等级正式发表）→ arXiv 排序；多 venue 取最高等级。
#    同年同档次保留本文件的 [[publication]] 顺序：纯期刊在前（彼此保留原顺序），
#    会议按举办时间从晚到早；合并条目按会议版时间排列，arXiv 保留原顺序。
#    已核对的会议日期及来源记录在条目前的注释中；新增论文时在对应位置插入。
#
# 字段拼错、方向 id 不存在、id 重复，都会在开发时报错、构建（CI）时直接失败。
#
# 数据来源与核对：DBLP 人物记录（注意 DBLP 把谢菲尔德同名的 Chaoyue Niu 混在了
# pid 176/5779 里，已按合作者名单剔除）与 arXiv 逐条交叉验证，2026-10 核对。

# 会议/期刊索引。等级参考 CCF 2026 目录，统一使用此版，不按论文年份回溯。
# https://www.ccf.org.cn/Academic_Evaluation/By_category/
# 目录副本：https://scdm-shu.github.io/ccf/2026-CCF-Ranking.pdf
# Workshop、Findings 不套用主会等级；SIGGRAPH Asia 按本站口径列为 A 类。
