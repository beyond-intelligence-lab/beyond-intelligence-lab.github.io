date = "2026-08"
en = "**1 paper** accepted at **EuroSys 2027 Spring Cycle**. Congratulations to **Zhengxiang**!"
zh = "**1 篇文章**被 **EuroSys 2027 Spring Cycle** 接收，恭喜 **Zhengxiang**！"

